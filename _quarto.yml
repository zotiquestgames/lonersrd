project:
  type: website
  output-dir: _site
  pre-render:
    - scripts/sync_content.py
  render:
    - index.qmd
    - loner-3e.md
    - loner-2e.md
    - loner-1e.md
    - companion.md
    - character_builders_guide.md
    - world_builders_guide.md
    - the_path_not_taken.md
    - cinematic_action.md
    - urban_fantasy.md
    - "adventure_packs/*.md"
    - "adventure_packs_2e/*.md"
    - "geared_towards_loner/*.md"
    - "!content/**"

# website.sidebar lives in _sidebar-auto.yml, regenerated by
# scripts/sync_content.py from content/ on every pre-render -- so newly
# synced pages get a nav entry without a manual edit here.
metadata-files:
  - _sidebar-auto.yml

website:
  title: "Loner SRD"
  description: "A minimalist solo role-playing game — free System Reference Document."
  site-url: "https://zotiquestgames.github.io/lonersrd/"
  repo-url: "https://github.com/zotiquestgames/lonersrd"
  repo-actions: [issue]

  navbar:
    left:
      - text: "Home"
        href: index.qmd
      - text: "Core Rules"
        href: loner-3e.md
      - text: "Adventure Packs"
        href: adventure_packs/AP01_fantasy.md
      - text: "Geared Towards Loner"
        href: geared_towards_loner/kwaidan_revised.md
    right:
      - icon: github
        href: https://github.com/zotiquestgames/lonersrd

  page-footer:
    left: "© 2021-2026 [Roberto Bisceglie](https://zotiquestgames.com)"
    right: "Built with [Quarto](https://quarto.org)"

filters:
  - _extensions/gfm-callout.lua
  - _extensions/typst-pagebreak-h1.lua

format:
  html:
    theme:
      light: [materia, assets/custom.scss]
      dark:  [darkly, assets/custom.scss]
    toc: true
    toc-depth: 3
    include-in-header: assets/fonts.html
    include-after-body: assets/format-links-top.html
    format-links:
      - format: typst
        text: PDF
        icon: file-pdf
      - odt
      - epub
      - gfm
